<link rel="stylesheet" href="/styles/app.css?v=__VICE_VERSION__">
<script type="application/json" id="saved-theme">null</script>
<script>
// The daemon supplies the saved selection and its prepaint colors in the
// document. Older installs still get their legacy cover during migration.
(function () {
  var BG = {blue:'#11131a',purple:'#161219',green:'#0c1513',red:'#1c110d',orange:'#1b120a'};
  var AC = {blue:'#8ab9f3',purple:'#d0bcff',green:'#85d7ae',red:'#ffb3ad',orange:'#ffb690'};
  function isHex(value) {
    return typeof value === 'string' && /^#[0-9a-f]{6}$/i.test(value);
  }
  // Match the manual palette's upper surface and contrast limits. Invalid
  // saved pairs get the same fallback on the cover and in React.
  function luminance(hex, lift) {
    return [1, 3, 5].reduce(function (total, i, channel) {
      var value = parseInt(hex.slice(i, i + 2), 16);
      var c = Math.round(value + (255 - value) * lift) / 255;
      var linear = c <= 0.04045 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4);
      return total + linear * [0.2126, 0.7152, 0.0722][channel];
    }, 0) + 0.05;
  }
  function validExact(bg, base) {
    var highest = luminance(bg, 0.21);
    return luminance('#d6d6d6', 0) / highest >= 4.5
      && luminance('#b5b5b5', 0) / highest >= 3
      && luminance(base, 0) / highest >= 4.5;
  }
  var name = 'blue', bg = null, ac = null;
  try {
    var saved = JSON.parse(document.getElementById('saved-theme').textContent);
    if (saved && saved.version === 1) {
      var choice = saved.selection || {};
      var boot = saved.boot || {};
      if (choice.mode === 'preset') name = choice.name;
      if (choice.mode === 'amoled') { bg = '#000000'; ac = '#ffffff'; }
      if (choice.mode === 'generated' && isHex(saved.seed) && saved.seed === boot.seed
          && isHex(boot.bg) && isHex(boot.base) && boot.bg !== '#000000'
          && luminance(boot.base, 0) / luminance(boot.bg, 0) >= 4.5) {
        bg = boot.bg;
        ac = boot.base;
      }
      if (choice.mode === 'manual' && saved.manual && isHex(boot.bg) && isHex(boot.base)
          && saved.manual.bg === boot.bg && saved.manual.base === boot.base && validExact(boot.bg, boot.base)) {
        bg = boot.bg;
        ac = boot.base;
      }
    } else {
      name = localStorage.getItem('vice-theme');
      if (name === 'custom' && isHex(localStorage.getItem('vice-custom-accent'))) {
        var b = localStorage.getItem('vice-custom-bg');
        var a = localStorage.getItem('vice-custom-base');
        if (isHex(b) && isHex(a)) { bg = b; ac = a; }
      }
    }
  } catch (e) { /* The default works without storage. */ }
  if (!bg) {
    if (typeof name !== 'string' || !Object.prototype.hasOwnProperty.call(BG, name)) name = 'blue';
    bg = BG[name];
    ac = AC[name];
  }
  var root = document.documentElement.style;
  root.setProperty('--vice-bg', bg);
  root.setProperty('--boot-accent', ac);
})();
</script>
</head>
<body>

<!-- Covers the first paint until React has mounted and the clips and config
     have landed, so the UI is never watched assembling itself. Removed by the
     app once the first screen is ready. -->
<div id="boot">
  <div class="boot-mark">
    <svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="2.25">
      <circle cx="12" cy="12" r="9.5"/>
      <circle cx="12" cy="12" r="3" fill="currentColor"/>
    </svg>
    <span class="boot-orbit"></span>
  </div>
  <div class="boot-word wordmark">VICE</div>
  <div class="boot-bar"><span></span></div>
</div>

<div id="root"></div>

<script type="module" src="/scripts/app.js?v=__VICE_VERSION__"></script>
</body>
</html>
